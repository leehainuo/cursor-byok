name: Feature request / 功能建议
description: Suggest an improvement / 提出改进建议
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: Describe the use case and current limitation. / 描述使用场景和当前限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 建议方案
    validations:
      required: true
