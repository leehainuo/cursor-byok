name: Release desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release author
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          if [[ "${GITHUB_ACTOR}" != "${REPOSITORY_OWNER}" || "${GITHUB_TRIGGERING_ACTOR}" != "${REPOSITORY_OWNER}" ]]; then
            echo "Only ${REPOSITORY_OWNER} may publish a release" >&2
            exit 1
          fi

      - name: Verify updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          fi

      - name: Read and verify app version
        id: version
        shell: bash
        run: |
          node .github/scripts/check-release.mjs --tag "${GITHUB_REF_NAME}"
          version=$(node -p "require('./apps/desktop/package.json').version")
          test "${GITHUB_REF_TYPE}" = "tag"
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag must point to a commit contained in origin/main" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check whether this version is already published
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          state=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | if .draft then "draft" else "published" end')
          if [[ "${state}" = "published" ]]; then
            echo "Version ${VERSION} is already published; use a new version." >&2
            exit 1
          fi
          echo "should_publish=true" >> "${GITHUB_OUTPUT}"

  checks:
    name: Release checks
    needs: prepare
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish (${{ matrix.platform }})
    needs: [prepare, checks]
    permissions:
      contents: write
    timeout-minutes: 90
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            args: ""
            target: ""
          - platform: windows-x86_64
            os: windows-latest
            args: "--bundles nsis"
            target: ""
          - platform: macos-aarch64
            os: macos-15
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            os: macos-15-intel
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ contains(matrix.platform, 'macos') && '-' || '' }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: Cursor BYOK v__VERSION__
          releaseBody: Download the installer for your platform from the assets below.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      # Tauri builds macOS DMGs, but tauri-action uploads only updater bundles.
      # Publish readable installers separately without renaming signed updater assets.
      - name: Upload macOS DMG installers
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          case "${PLATFORM}" in
            macos-aarch64) arch=arm64 ;;
            macos-x86_64) arch=x64 ;;
            *) echo "Unsupported macOS platform: ${PLATFORM}" >&2; exit 1 ;;
          esac

          dmgs=(target/"${TARGET}"/release/bundle/dmg/*.dmg)
          if [[ "${#dmgs[@]}" -ne 1 ]]; then
            echo "Expected exactly one macOS DMG; found ${#dmgs[@]}" >&2
            exit 1
          fi

          installer="cursor-byok-${VERSION}-macos-${arch}.dmg"
          cp "${dmgs[0]}" "${installer}"
          gh release upload "v${VERSION}" "${installer}" --clobber

      - name: Package and sign Windows portable update
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force portable-update | Out-Null
          $asset = "portable-update/cursor-byok-$env:VERSION-windows-amd64.zip"
          Compress-Archive -LiteralPath target/release/cursor-byok-desktop.exe,LICENSE,THIRD-PARTY-LICENSES.md -DestinationPath $asset
          Push-Location apps/desktop
          npm exec tauri signer sign -- "../../$asset"
          Pop-Location
          if (!(Test-Path "$asset.sig")) {
            throw "Windows portable update signature was not generated"
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'windows-x86_64'
        with:
          name: windows-portable-update
          path: portable-update/*
          if-no-files-found: error

  finalize:
    name: Publish GitHub Release
    needs: [prepare, publish]
    if: needs.prepare.outputs.should_publish == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-portable-update
          path: portable-update

      - name: Generate signed Windows portable update manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          asset="cursor-byok-${VERSION}-windows-amd64.zip"
          test -f "portable-update/${asset}"
          test -f "portable-update/${asset}.sig"
          node .github/scripts/generate-portable-update.mjs \
            --version "${VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --asset "${asset}" \
            --signature "portable-update/${asset}.sig" \
            --output portable-update/portable-latest.json

      - name: Normalize Tauri updater download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p tauri-update
          release_id=$(
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id"
          )
          test -n "${release_id}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > tauri-update/release.json
          asset_id=$(node -p 'require("./tauri-update/release.json").assets.find(({ name }) => name === "latest.json")?.id ?? ""')
          test -n "${asset_id}"
          gh api \
            -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
            > tauri-update/latest.json
          node .github/scripts/normalize-tauri-update.mjs \
            --manifest tauri-update/latest.json \
            --release tauri-update/release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${VERSION}"

      - name: Upload normalized Tauri updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v${VERSION}" tauri-update/latest.json --clobber

      - name: Upload Windows portable update and license notices
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "v${VERSION}" portable-update/* LICENSE THIRD-PARTY-LICENSES.md --clobber

      - name: Verify installers exist on the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh release view "v${VERSION}" --json assets --jq '[.assets[].name]')
          for installer in \
            "cursor-byok-${VERSION}-macos-arm64.dmg" \
            "cursor-byok-${VERSION}-macos-x64.dmg" \
            "Cursor.BYOK_${VERSION}_x64-setup.exe" \
            "cursor-byok-${VERSION}-windows-amd64.zip" \
            "Cursor.BYOK_${VERSION}_amd64.AppImage" \
            "Cursor.BYOK_${VERSION}_amd64.deb" \
            "Cursor.BYOK-${VERSION}-1.x86_64.rpm" ; do
            echo "${assets}" | jq -e --arg name "${installer}" 'index($name) != null' >/dev/null
          done

      - name: Write release notes and download guide
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          cat ".github/release-notes/${VERSION}.md" > RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md <<EOF

          ## Download / 下载安装

          | Platform | Package |
          | --- | --- |
          | macOS Apple Silicon (arm64) | [Download DMG](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/cursor-byok-${VERSION}-macos-arm64.dmg) |
          | macOS Intel | [Download DMG](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/cursor-byok-${VERSION}-macos-x64.dmg) |
          | Windows x64 (Installer) | [Download EXE](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Cursor.BYOK_${VERSION}_x64-setup.exe) |
          | Windows x64 (Portable) | [Download ZIP](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/cursor-byok-${VERSION}-windows-amd64.zip) |
          | Linux x64 (AppImage) | [Download AppImage](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Cursor.BYOK_${VERSION}_amd64.AppImage) |
          | Linux x64 (Debian/Ubuntu) | [Download DEB](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Cursor.BYOK_${VERSION}_amd64.deb) |
          | Linux x64 (Fedora/RHEL) | [Download RPM](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/Cursor.BYOK-${VERSION}-1.x86_64.rpm) |

          The other files in Assets, including signature files (.sig), latest.json and portable-latest.json, are used by automatic updates. macOS packages are ad-hoc signed and are not Apple-notarized.

          **Changes:** https://github.com/${GITHUB_REPOSITORY}/commits/v${VERSION}

          This is an unofficial project and is not affiliated with Cursor.
          EOF

      - name: Update draft release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v${VERSION}" --notes-file RELEASE_NOTES.md

      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v${VERSION}" --draft=false --latest
