syntax = "proto3";

package aiserver.v1;

import "google/protobuf/struct.proto";

// Wire subset used by Cursor's client-owned Agent loop. Field numbers follow
// the installed Cursor client; unknown fields remain the client's responsibility.
message RunInferenceClientMessage {
  oneof message {
    RunInferenceRunRequest run_request = 1;
    RunInferenceInvokeModel invoke_model = 2;
    RunInferenceCancelInvocation cancel_invocation = 3;
    RunInferenceFinishRun finish_run = 4;
  }
}

message RunInferenceRunRequest {
  string conversation_id = 1;
  InferenceRequestedModel requested_model = 3;
  optional string agent_mode = 5;
}

message RunInferenceInvokeModel {
  string invocation_id = 1;
  InferenceStreamRequest request = 2;
  RunInferenceDeltaBase delta_base = 5;
  bytes config_fingerprint = 6;
  RunInferenceCompressedRequest compressed_request = 7;
}

message RunInferenceDeltaBase {
  string invocation_id = 1;
  uint32 message_count = 2;
  bytes prefix_sha256 = 3;
  bool reuse_tools = 4;
  bytes request_sha256 = 5;
}

message RunInferenceCompressedRequest {
  int32 encoding = 1;
  uint32 decoded_size = 2;
  bytes data = 3;
}

message RunInferenceCancelInvocation { string invocation_id = 1; }
message RunInferenceFinishRun { bool aborted = 1; }

message RunInferenceServerMessage {
  oneof message {
    RunInferenceHeartbeat heartbeat = 1;
    RunInferenceRunReady run_ready = 2;
    RunInferenceInvocationResponse invocation_response = 3;
    RunInferenceInvocationEnd invocation_end = 4;
  }
}

message RunInferenceHeartbeat { bool accepts_speculative_invocations = 1; }

message RunInferenceRunReady {
  InferenceRequestedModel resolved_model = 1;
  bool supports_self_summary = 2;
  optional string routed_model_display_name = 3;
  RunInferencePromptModelMetadata prompt_model_metadata = 4;
  bool accepts_client_heartbeat = 7;
  bool accepts_agent_events = 8;
  bool accepts_aborted_finish = 13;
  bool accepts_subagent_model_resolution = 14;
  bool accepts_tool_call_events = 15;
  bool accepts_client_first_call_timings = 16;
  bytes config_fingerprint = 17;
  bool accepts_delta_invocations = 18;
}

message RunInferencePromptModelMetadata {
  string vendor = 1;
  string prompt_version = 2;
  bool is_sonnet45 = 3;
  bool is_gemini3 = 4;
  bool is_gpt51 = 5;
  bool is_gpt52 = 6;
  bool is_gpt5 = 7;
  bool is_gpt55 = 8;
  bool is_gpt56 = 9;
  bool is_sonnet4 = 10;
  bool is_codex_family = 11;
  bool is_gpt54 = 12;
  bool is_claude_4x = 16;
  bool is_opus45 = 17;
  bool is_opus46 = 18;
  bool is_opus48 = 19;
  bool is_opus5 = 20;
  bool is_gpt5_family = 23;
  optional string reasoning_effort = 30;
  string persona = 35;
  string self_identity_name = 44;
}

message RunInferenceInvocationResponse {
  string invocation_id = 1;
  InferenceStreamResponse response = 2;
}

message RunInferenceInvocationEnd {
  string invocation_id = 1;
  RunInferenceInvocationError error = 2;
  optional int32 delta_refused = 3;
}

message RunInferenceInvocationError {
  int32 code = 1;
  string message = 2;
}

message InferenceRequestedModel {
  string model_id = 1;
  bool max_mode = 2;
  repeated InferenceModelParameterValue parameters = 3;
  bool built_in_model = 4;
}

message InferenceModelParameterValue {
  string id = 1;
  string value = 2;
}

message InferenceStreamRequest {
  repeated InferenceCoreMessage messages = 1;
  repeated InferenceAgentTool tools = 2;
  InferenceModelConfig model_config = 4;
  optional string model_id = 5;
  optional string invocation_id = 6;
  InferenceRequestedModel requested_model = 7;
  optional string conversation_id = 8;
}

message InferenceCoreMessage {
  int32 role = 1;
  oneof content {
    string text = 2;
    InferenceContentParts parts = 3;
    InferenceToolResultContent tool_content = 6;
  }
  repeated InferenceToolCall tool_calls = 4;
  repeated InferenceReasoningPart reasoning_parts = 7;
  optional string model_provider_message_id = 8;
}

message InferenceContentParts { repeated InferenceContentPart parts = 1; }

message InferenceContentPart {
  oneof part {
    InferenceTextPart text = 1;
    InferenceImagePart image = 2;
    InferenceFilePart file = 3;
  }
}

message InferenceTextPart { string text = 1; }
message InferenceImagePart {
  string data = 1;
  optional string mime_type = 2;
}
message InferenceFilePart {
  string data = 1;
  string media_type = 2;
  optional string filename = 3;
}

message InferenceToolCall {
  string tool_call_id = 1;
  string tool_name = 2;
  google.protobuf.Struct args = 3;
  optional string raw_tool_call_args = 4;
}

message InferenceToolResultContent { repeated InferenceToolResultPart parts = 1; }

message InferenceToolResultPart {
  string tool_call_id = 1;
  string tool_name = 2;
  google.protobuf.Value result = 3;
  bool is_error = 4;
  repeated InferenceContentPart experimental_content = 5;
}

message InferenceReasoningPart {
  bool is_redacted = 1;
  string text = 2;
  optional string signature = 3;
  optional string redacted_data = 4;
  optional string model_name = 5;
}

message InferenceAgentTool {
  string name = 1;
  string description = 2;
  google.protobuf.Struct parameters = 3;
}

message InferenceModelConfig {
  optional int32 max_tokens = 1;
  optional float temperature = 2;
  optional float top_p = 3;
  repeated string stop_sequences = 4;
}

message InferenceStreamResponse {
  oneof response {
    InferenceTextStreamPart text_part = 1;
    InferenceToolCallStreamPart tool_call_part = 2;
    InferenceUsageInfo usage = 3;
    InferenceResponseInfo response_info = 4;
    InferenceExtendedUsageInfo extended_usage = 5;
    InferenceInvocationIdInfo invocation_id = 7;
    InferenceStreamError error = 8;
    InferenceThinkingStreamPart thinking_part = 9;
  }
}

message InferenceInvocationIdInfo { string invocation_id = 1; }

message InferenceTextStreamPart {
  string text = 1;
  bool is_final = 2;
}

message InferenceThinkingStreamPart {
  string text = 1;
  optional string signature = 2;
  bool is_final = 3;
  optional string redacted_data = 6;
}

message InferenceToolCallStreamPart {
  string tool_call_id = 1;
  string tool_name = 2;
  string args = 3;
  bool is_complete = 4;
  optional int32 tool_index = 5;
}

message InferenceUsageInfo {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  optional int32 total_tokens = 3;
}

message InferenceExtendedUsageInfo {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
  int32 cache_read_tokens = 3;
  int32 cache_write_tokens = 4;
  int32 max_tokens = 5;
  optional int32 reasoning_tokens = 6;
}

message InferenceStreamError {
  string message = 1;
  string code = 2;
  bool is_input_token_limit_error = 3;
  bool is_output_token_limit_error = 4;
  int32 error_type = 5;
}

message InferenceResponseInfo {
  string id = 1;
  string model = 2;
  int64 created_at = 3;
  repeated InferenceResponseMessage messages = 4;
  optional string error_message = 5;
}

message InferenceResponseMessage {
  string id = 1;
  int32 role = 2;
  optional string content = 3;
  repeated InferenceToolCall tool_calls = 4;
  InferenceToolResultContent tool_result = 5;
}
